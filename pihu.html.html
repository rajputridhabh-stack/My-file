<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pihu Sorry 💖</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Dancing+Script:wght@700&display=swap');
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:Poppins,sans-serif;background:linear-gradient(-45deg,#ff6b6b,#feca57,#ff9ff3,#54a0ff);background-size:400% 400%;animation:gradientShift 10s ease infinite;height:100vh;overflow:hidden;}
        @keyframes gradientShift{0%{background-position:0%50%}50%{background-position:100%50%}100%{background-position:0%50%}}
        
        .hearts{position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:1;}
        .heart{position:absolute;font-size:24px;color:#fff;animation:float 4s linear infinite;}
        @keyframes float{0%{transform:translateY(100vh) scale(0);opacity:1}100%{transform:translateY(-100px) scale(1.5);opacity:0;}}
        
        .page{position:fixed;top:0;left:0;width:100%;height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:20px;background:rgba(0,0,0,0.1);opacity:0;transition:opacity 0.5s;}
        .page.active{opacity:1;z-index:10;}
        
        .title{font-family:'Dancing Script',cursive;font-size:2.8rem;color:#fff;text-shadow:0 0 20px rgba(255,255,255,0.8);margin-bottom:20px;animation:pulse 2s infinite;}
        @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
        
        .card{background:rgba(255,255,255,0.95);border-radius:20px;padding:30px;max-width:90%;width:100%;box-shadow:0 20px 40px rgba(0,0,0,0.3);}
        .sorry-msg{color:#e91e63;font-size:1.2rem;font-weight:600;margin-bottom:20px;padding:15px;background:linear-gradient(45deg,#ff9ff3,#feca57);border-radius:15px;}
        .question{font-size:1.5rem;color:#333;font-weight:600;margin:20px 0;}
        .qnum{background:linear-gradient(45deg,#ff6b6b,#feca57);color:#fff;padding:8px 15px;border-radius:20px;font-weight:600;display:inline-block;margin-bottom:10px;}
        
        .buttons{display:flex;gap:15px;justify-content:center;flex-wrap:wrap;margin-top:25px;}
        button{padding:15px 25px;font-size:1.1rem;font-weight:600;border:none;border-radius:25px;cursor:pointer;transition:all 0.3s;box-shadow:0 10px 20px rgba(0,0,0,0.2);touch-action:manipulation;-webkit-appearance:none;-webkit-tap-highlight-color:transparent;}
        .yes{background:linear-gradient(45deg,#00b894,#00cec9);color:#fff;}
        .no{background:linear-gradient(45deg,#e17055,#d63031);color:#fff;}
        button:active{transform:scale(0.95);}
        
        .runaway{animation:runaway 2.5s ease-in-out !important;pointer-events:none!important;}
        @keyframes runaway{0%{transform:translateX(0) rotate(0deg);}25%{transform:translateX(80px) translateY(-40px) rotate(180deg);}50%{transform:translateX(-60px) translateY(30px) rotate(360deg);}75%{transform:translateX(40px) translateY(-60px) rotate(540deg);}100%{transform:translateX(0) rotate(720deg);}}
        
        .shake{animation:shake 0.5s;}
        @keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-10px);}75%{transform:translateX(10px);}}
        
        .plead{color:#e91e63;font-size:1rem;font-style:italic;margin-top:15px;animation:blink 2s infinite;}
        @keyframes blink{0%,50%{opacity:1;}50.1%,100%{opacity:0.4;}}
        
        .sign{font-family:'Dancing Script',cursive;font-size:1.6rem;color:#fff;text-shadow:0 0 10px rgba(255,255,255,0.8);margin-top:20px;}
        
        @media(max-width:500px){.title{font-size:2.2rem;}.question{font-size:1.3rem;}}
    </style>
</head>
<body>
    <div class="hearts" id="hearts"></div>
    
    <div class="page active" id="p0">
        <h1 class="title">Pihu Sorry 😢</h1>
        <div class="card">
            <div class="sorry-msg">Baby maine galti ki... mujhe maaf kar do 🥺<br>Tu mera sab kuch hai 💕</div>
            <div class="question">Maaf karegi na?</div>
            <div class="buttons">
                <button class="yes" onclick="nextQ(1)">Haan Jaan ❤️</button>
                <button class="no" id="n0" onclick="noFun(0)">Nahi 😠</button>
            </div>
            <div class="plead" id="pl0">Please haan bol na... 🥺</div>
        </div>
        <div class="sign">Pihu 💋</div>
    </div>
    
    <div class="page" id="p1">
        <h1 class="title">Q1 💖</h1>
        <div class="card">
            <div class="qnum">प्रश्न 1</div>
            <div class="question">Abhi bhi pyar karti hai?</div>
            <div class
